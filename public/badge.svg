<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Notification badge: monochrome, solid, no ring. Chrome renders this on the
       notification shade's dark surface. -->
  <circle cx="48" cy="48" r="46" fill="#000000" />
  <circle cx="48" cy="48" r="34" fill="none" stroke="#ffffff" stroke-width="10" />
  <line x1="48" y1="14" x2="48" y2="34" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
</svg>