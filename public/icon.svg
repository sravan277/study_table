<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Day Dial</title>
  <rect width="512" height="512" fill="#0b0f14" />
  <g transform="translate(256 256)" fill="none" stroke-linecap="butt">
    <!-- The dial: 24 hours, twelve o'clock at the top. -->
    <circle r="170" stroke="#63748a" stroke-width="46" opacity="0.14" />
    <path d="M 0 -170 A 170 170 0 0 1 118.6 -122.5" stroke="#63748a" stroke-width="46" opacity="0.1" />
    <path d="M 118.6 -122.5 A 170 170 0 0 1 162.8 -52.6" stroke="#2fb98c" stroke-width="46" opacity="0.55" />
    <path d="M 162.8 -52.6 A 170 170 0 0 1 170 0" stroke="#63748a" stroke-width="46" opacity="0.16" />
    <path d="M 170 0 A 170 170 0 0 1 0 170" stroke="#4f6fe8" stroke-width="46" opacity="0.9" />
    <path d="M 0 170 A 170 170 0 0 1 -70 155" stroke="#4f6fe8" stroke-width="46" opacity="0.55" />
    <path d="M -70 155 A 170 170 0 0 1 -150 80.5" stroke="#63748a" stroke-width="46" opacity="0.16" />
    <path d="M -150 80.5 A 170 170 0 0 1 -170 0" stroke="#e8973f" stroke-width="46" opacity="0.8" />
    <path d="M -170 0 A 170 170 0 0 1 0 -170" stroke="#4f6fe8" stroke-width="46" opacity="0.7" />
    <!-- The needle. -->
    <line x1="0" y1="-146" x2="0" y2="-196" stroke="#ffffff" stroke-width="5" />
  </g>
  <circle cx="256" cy="256" r="7" fill="#ffffff" />
</svg>